<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Cheap Assignments UK</title>
<style>
:root{--navy:#101d35;--gold:#d6ad65;--ink:#182238;--muted:#68748a;--line:#e5e9f0;--paper:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Inter,system-ui,Arial;color:var(--ink)}.wrap{width:min(1200px,calc(100% - 32px));margin:auto}header{background:var(--navy);color:white;padding:18px 0}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.3px}.brand small{display:block;color:#bdc8d9;font-size:10px;letter-spacing:1.5px}.btn{background:var(--gold);border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.secondary{background:#edf0f5;color:var(--ink)}main{padding:30px 0}.login,.box{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:0 8px 25px #14213a08}.login{max-width:410px;margin:70px auto}.login h1{font:27px Georgia;color:var(--navy)}input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:7px;width:100%;margin:6px 0 14px;font:14px inherit}label{font-size:12px;font-weight:750}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.top h1{font:32px Georgia;color:var(--navy);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);padding:16px;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat b{font:28px Georgia;color:var(--navy)}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{background:#fafbfd;color:#59657a}.pill{padding:4px 8px;border-radius:20px;background:#edf0f5;font-weight:750;font-size:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.detail{margin-top:18px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:var(--muted);font-size:12px}.error{color:#9a352b;font-size:12px}.success{color:#256338;font-size:12px}.filelink{color:#9a7134;text-decoration:underline}.row{display:flex;gap:10px;align-items:center}.row>*{width:auto}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr}.head{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><header><div class="wrap head"><div class="brand">CHEAP ASSIGNMENTS UK<small>ADMINISTRATION PORTAL</small></div><button class="btn secondary hidden" id="logout">Log out</button></div></header><main class="wrap">
<section class="login" id="login"><h1>Admin sign in</h1><p class="muted">Sign in to manage quote requests.</p><form id="loginForm"><label>Admin email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn" style="width:100%">Sign in</button><p id="loginError" class="error"></p></form></section>
<section id="dashboard" class="hidden"><div class="top"><div><h1>Quote requests</h1><div class="muted">Review enquiries, prepare quotes and update request status.</div></div><button class="btn secondary" id="refresh">Refresh</button></div>
<div class="stats"><div class="stat"><small>Total requests</small><b id="total">0</b></div><div class="stat"><small>New</small><b id="new">0</b></div><div class="stat"><small>Quote sent</small><b id="quoted">0</b></div><div class="stat"><small>Accepted</small><b id="accepted">0</b></div></div>
<div class="tablewrap"><table><thead><tr><th>Received</th><th>Student</th><th>Service</th><th>Deadline</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="box detail hidden" id="detail"><div class="top"><h2 id="detailTitle" style="font:25px Georgia;margin:0">Request details</h2><button class="btn secondary" id="closeDetail">Close</button></div><div class="detailgrid"><div><p class="muted" id="detailMeta"></p><p id="detailBody"></p><p id="attachment"></p></div><div><label>Quote amount (£)</label><input id="amount" type="number" min="0" step="0.01" placeholder="e.g. 45.00"><label>Message to student</label><textarea id="quoteMessage" rows="5" placeholder="Explain what support is included, the price and next steps."></textarea><label>Status</label><select id="status"><option>New</option><option>Under review</option><option>Quote sent</option><option>Accepted</option><option>Declined</option><option>Completed</option></select><div class="row"><button class="btn" id="saveQuote">Save & email quote</button><button class="btn secondary" id="saveStatus">Save status</button></div><p class="muted" id="actionMsg"></p></div></div></div>
</section></main>
<script>
let selected=null,requests=[];
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function check(){try{const d=await api("/api/admin/me");$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logout").classList.remove("hidden");await load()}catch{$("login").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logout").classList.add("hidden")}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();await check()}catch(err){$("loginError").textContent=err.message}};
$("logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});check()};
$("refresh").onclick=load;
async function load(){try{let d=await api("/api/admin/requests");requests=d.requests;$("total").textContent=requests.length;$("new").textContent=requests.filter(x=>x.status==="New").length;$("quoted").textContent=requests.filter(x=>x.status==="Quote sent").length;$("accepted").textContent=requests.filter(x=>x.status==="Accepted").length;$("rows").innerHTML=requests.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td><b>${esc(x.name)}</b><br>${esc(x.email)}</td><td>${esc(x.service)}</td><td>${esc(x.deadline||"—")}</td><td><span class="pill">${esc(x.status)}</span></td><td><button class="btn" onclick="openRequest(${x.id})">View / quote</button></td></tr>`).join("")||'<tr><td colspan="6">No quote requests yet.</td></tr>'}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.openRequest=async id=>{selected=requests.find(x=>x.id===id);if(!selected)return;$("detail").classList.remove("hidden");$("detailTitle").textContent="Request #"+selected.reference;$("detailMeta").textContent=`${selected.name} • ${selected.email} • ${selected.language} • ${selected.created_at}`;$("detailBody").innerHTML=`<b>Service:</b> ${esc(selected.service)}<br><b>Subject:</b> ${esc(selected.subject||"—")}<br><b>Study level:</b> ${esc(selected.study_level||"—")}<br><b>Word count:</b> ${esc(selected.word_count||"—")}<br><b>Deadline:</b> ${esc(selected.deadline||"—")}<br><br><b>Details:</b><br>${esc(selected.details).replace(/\\n/g,"<br>")}`;$("attachment").innerHTML=selected.file_name?`<a class="filelink" href="/api/admin/requests/${id}/file">Download ${esc(selected.file_name)}</a>`:"No attachment";$("amount").value=selected.quote_amount||"";$("quoteMessage").value=selected.quote_message||"";$("status").value=selected.status;$("actionMsg").textContent="";$("detail").scrollIntoView({behavior:"smooth"})};
$("closeDetail").onclick=()=>$("detail").classList.add("hidden");
$("saveQuote").onclick=async()=>{if(!selected)return;try{await api(`/api/admin/requests/${selected.id}/quote`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:$("amount").value,message:$("quoteMessage").value})});$("actionMsg").className="success";$("actionMsg").textContent="Quote saved. Email delivery attempted.";await load();selected=requests.find(x=>x.id===selected.id)}catch(e){$("actionMsg").className="error";$("actionMsg").textContent=e.message}};
$("saveStatus").onclick=async()=>{if(!selected)return;try{await api(`/api/admin/requests/${selected.id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:$("status").value})});$("actionMsg").className="success";$("actionMsg").textContent="Status updated.";await load();selected=requests.find(x=>x.id===selected.id)}catch(e){$("actionMsg").className="error";$("actionMsg").textContent=e.message}};
check();
</script></body></html>
